<!DOCTYPE html>
<html>
<head>

    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
        }

        .box {
            background-color: lightblue;
            border: 1px solid black;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Grid Example</h2>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>

</body>
</html>
